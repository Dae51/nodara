name: Flutter CI

# Corre el análisis y los tests en cada PR hacia master y en cada push a master.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
